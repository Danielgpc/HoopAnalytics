[project]
name = "hoopanalytics"
version = "0.1.0"
description = "App for analyzing NBA data"
readme = "README.md"
authors = [
    { name = "Daniel Carvalho", email = "danielgpcarvalho20121212@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
hoopanalitics = "hoopanalytics:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
